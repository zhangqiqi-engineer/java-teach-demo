plugins {
    // Spring Boot 插件：负责打包、运行、依赖管理
    id 'org.springframework.boot' version '3.5.16'
    // 依赖版本对齐插件：让第三方依赖版本与 Spring Boot 推荐版本一致
    id 'io.spring.dependency-management' version '1.1.7'
    // Java 插件：编译、测试、打包基础能力
    id 'java'
}

group = 'com.example'
version = '1.0.0'

java {
    // 教学项目统一使用 JDK 17（Spring Boot 3.x 最低要求）
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    // 优先使用国内镜像，加快依赖下载（可选阿里云）
    maven { url 'https://maven.aliyun.com/repository/public' }
    mavenCentral()
}

dependencies {
    // Web 开发（内嵌 Tomcat、Spring MVC、JSON 等）
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // 参数校验（@Valid、@NotBlank 等）
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // MyBatis 与 Spring Boot 整合
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'

    // MySQL 驱动（runtimeOnly：运行时才需要）
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Lombok：减少 getter/setter 等样板代码（教学中可对比手写）
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 单元测试
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
