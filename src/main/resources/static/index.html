<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>学生管理系统 · 教学演示</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">Teach</span>
      <span class="brand-sub">Java 教学演示</span>
    </div>
    <nav class="nav">
      <a class="nav-item active" href="#">学生管理</a>
      <a class="nav-item" href="./course.html">课程管理</a>
    </nav>
    <div class="sidebar-foot">
      <p>Spring Boot 3.5 + MyBatis</p>
      <p>JDK 17 · Gradle</p>
    </div>
  </aside>

  <main class="main">
    <header class="page-header">
      <div>
        <h1>学生管理</h1>
        <p class="page-desc">演示增删改查、分页查询与表单校验</p>
      </div>
      <button type="button" class="btn btn-primary" id="btnAdd">新增学生</button>
    </header>

    <section class="toolbar">
      <div class="filters">
        <input type="text" id="qName" placeholder="姓名" />
        <input type="text" id="qStudentNo" placeholder="学号" />
        <input type="text" id="qClassName" placeholder="班级" />
        <button type="button" class="btn btn-secondary" id="btnSearch">查询</button>
        <button type="button" class="btn btn-ghost" id="btnReset">重置</button>
      </div>
    </section>

    <section class="table-wrap">
      <table>
        <thead>
        <tr>
          <th>ID</th>
          <th>学号</th>
          <th>姓名</th>
          <th>性别</th>
          <th>年龄</th>
          <th>班级</th>
          <th>手机号</th>
          <th>备注</th>
          <th>操作</th>
        </tr>
        </thead>
        <tbody id="tableBody">
        <tr><td colspan="9" class="empty">加载中...</td></tr>
        </tbody>
      </table>
    </section>

    <footer class="pager">
      <span id="pageInfo">共 0 条</span>
      <div class="pager-actions">
        <button type="button" class="btn btn-ghost" id="btnPrev">上一页</button>
        <span id="pageNum">1</span>
        <button type="button" class="btn btn-ghost" id="btnNext">下一页</button>
      </div>
    </footer>
  </main>
</div>

<!-- 新增 / 编辑弹窗 -->
<div class="modal-mask" id="modal" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <h2 id="modalTitle">新增学生</h2>
      <button type="button" class="icon-btn" id="btnClose" aria-label="关闭">×</button>
    </div>
    <form id="studentForm" class="modal-body">
      <input type="hidden" id="fId" />
      <label>
        <span>学号 <em>*</em></span>
        <input type="text" id="fStudentNo" required maxlength="32" />
      </label>
      <label>
        <span>姓名 <em>*</em></span>
        <input type="text" id="fName" required maxlength="50" />
      </label>
      <label>
        <span>性别 <em>*</em></span>
        <select id="fGender" required>
          <option value="男">男</option>
          <option value="女">女</option>
        </select>
      </label>
      <label>
        <span>年龄</span>
        <input type="number" id="fAge" min="1" max="150" />
      </label>
      <label>
        <span>班级</span>
        <input type="text" id="fClassName" maxlength="50" />
      </label>
      <label>
        <span>手机号</span>
        <input type="text" id="fPhone" maxlength="20" />
      </label>
      <label class="full">
        <span>备注</span>
        <textarea id="fRemark" rows="2" maxlength="200"></textarea>
      </label>
    </form>
    <div class="modal-footer">
      <button type="button" class="btn btn-ghost" id="btnCancel">取消</button>
      <button type="button" class="btn btn-primary" id="btnSave">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="/js/app.js"></script>
</body>
</html>
